[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "port"
version = "0.2.0"
description = "Automated porting CLI — port GitHub Copilot components to Claude Code format."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "McFuzzySquirrel" }]
keywords = ["porting", "claude-code", "copilot", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
port = "port.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
port = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
